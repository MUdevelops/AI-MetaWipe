<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI MetaWipe | Image Metadata and PNG Toolkit</title>
    <meta name="description" content="View, remove and edit image metadata, optimize PNGs and check privacy. Runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080D18" />
    <script>try{var u=JSON.parse(localStorage.getItem("metawipe.ui")||"{}");var t=u.theme||"dark";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
