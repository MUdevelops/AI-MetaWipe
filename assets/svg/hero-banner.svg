<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">AI MetaWipe</title><desc id="d">Animated banner for AI MetaWipe, a privacy-first image metadata toolkit</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#080D18"/><stop offset="1" stop-color="#0D1524"/></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><radialGradient id="g1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.3"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.3"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.25"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#26364D"/></pattern><clipPath id="cl"><rect width="1200" height="340" rx="26"/></clipPath><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cyc{opacity:0;animation:cyc 16s ease-in-out infinite}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.pill{animation:pillg 7.2s ease-in-out infinite}
@keyframes pillg{0%,16%,100%{stroke-opacity:.35;fill-opacity:.12}6%{stroke-opacity:1;fill-opacity:.4}}
.bar{animation:red 9s ease-in-out infinite}
@keyframes red{0%,8%{transform:scaleX(0)}22%,66%{transform:scaleX(1)}84%,100%{transform:scaleX(0)}}
.scan{animation:scan 4.5s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(48px)}50%{transform:translateY(196px)}}
.sA{animation:sA 9s ease-in-out infinite}.sB{opacity:0;animation:sB 9s ease-in-out infinite}
@keyframes sA{0%,40%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes sB{0%,40%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
@media (prefers-reduced-motion:reduce){.cyc{opacity:0}.cyc.first{opacity:1}.bar{transform:scaleX(1)}.sB{opacity:1}.sA{opacity:0}}
</style>
<g clip-path="url(#cl)"><rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#dots)" opacity=".55"/><g class="drift1"><circle cx="180" cy="90" r="330" fill="url(#g1)"/></g><g class="drift2"><circle cx="1050" cy="290" r="360" fill="url(#g2)"/></g><circle cx="620" cy="-20" r="260" fill="url(#g3)"/><rect class="sweep" x="0" y="0" width="300" height="340" fill="url(#sh)" transform="skewX(-18)" style="animation-duration:9s"/><g transform="translate(64,56)"><g class="tb float"><circle class="tb ring" cx="48" cy="48" r="52" fill="none" stroke="#22D3EE" stroke-width="2"/><rect width="96" height="96" rx="26" fill="url(#lg)"/><g transform="scale(3)"><path d="M16 6l8 3v6.5c0 4.7-3.3 7.9-8 9.5-4.7-1.6-8-4.8-8-9.5V9z" fill="none" stroke="#04121A" stroke-width="2" stroke-linejoin="round"/><path d="M11.5 16.5h9M11.5 13h5" stroke="#04121A" stroke-width="2" stroke-linecap="round"/></g></g></g><text x="196" y="132" font-size="74" font-weight="800" fill="url(#tg)" letter-spacing="-2">AI MetaWipe</text><text class="cyc first" x="198" y="184" font-size="25" fill="#E2E8F0" opacity="1" style="animation-delay:0s">Strip EXIF, GPS and AI prompt data in one drop.</text><text class="cyc" x="198" y="184" font-size="25" fill="#E2E8F0" style="animation-delay:4s">Remove metadata without touching a single pixel.</text><text class="cyc" x="198" y="184" font-size="25" fill="#E2E8F0" style="animation-delay:8s">Edit, verify and optimize, all inside your browser.</text><text class="cyc" x="198" y="184" font-size="25" fill="#E2E8F0" style="animation-delay:12s">Share images safely. Nothing is ever uploaded.</text><rect class="pill" x="198" y="214" width="78" height="32" rx="16" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-width="1.6" style="animation-delay:0.0s"/><text x="237.0" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">EXIF</text><rect class="pill" x="288" y="214" width="67" height="32" rx="16" fill="#FB7185" fill-opacity=".14" stroke="#FB7185" stroke-width="1.6" style="animation-delay:1.2s"/><text x="321.5" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">GPS</text><rect class="pill" x="367" y="214" width="78" height="32" rx="16" fill="#3B82F6" fill-opacity=".14" stroke="#3B82F6" stroke-width="1.6" style="animation-delay:2.4s"/><text x="406.0" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">IPTC</text><rect class="pill" x="457" y="214" width="67" height="32" rx="16" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-width="1.6" style="animation-delay:3.5999999999999996s"/><text x="490.5" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">XMP</text><rect class="pill" x="536" y="214" width="122" height="32" rx="16" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-width="1.6" style="animation-delay:4.8s"/><text x="597.0" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">PNG text</text><rect class="pill" x="670" y="214" width="78" height="32" rx="16" fill="#FBBF24" fill-opacity=".14" stroke="#FBBF24" stroke-width="1.6" style="animation-delay:6.0s"/><text x="709.0" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">C2PA</text><text x="198" y="296" font-size="17" font-weight="700" letter-spacing="1.5" fill="#94A3B8">VIEW · CLEAN · EDIT · OPTIMIZE · SHARE SAFELY</text><g transform="translate(850,48) rotate(2.5)"><rect width="300" height="236" rx="18" fill="#0D1524" stroke="#26364D" stroke-width="1.5"/><text x="18" y="32" font-size="14" font-weight="700" fill="#F8FAFC">holiday-photo.jpg</text><rect x="196" y="16" width="86" height="22" rx="11" fill="none" stroke="#26364D"/><text x="239" y="31.5" text-anchor="middle" font-size="11" fill="#94A3B8">Illustration</text><line x1="14" y1="46" x2="286" y2="46" stroke="#26364D"/><text x="18" y="74" font-size="13" fill="#94A3B8">Camera</text><text x="282" y="74" text-anchor="end" font-size="13" font-weight="600" fill="#CBD5E1">Canon EOS R5</text><rect class="tl bar" x="142" y="61" width="142" height="18" rx="4" fill="#CBD5E1" style="animation-delay:0.0s"/><text x="18" y="99" font-size="13" fill="#94A3B8">GPS</text><text x="282" y="99" text-anchor="end" font-size="13" font-weight="600" fill="#FBBF24">31.4° N, 74.3° E</text><rect class="tl bar" x="142" y="86" width="142" height="18" rx="4" fill="#CBD5E1" style="animation-delay:0.35s"/><text x="18" y="124" font-size="13" fill="#94A3B8">Taken</text><text x="282" y="124" text-anchor="end" font-size="13" font-weight="600" fill="#CBD5E1">2026-03-14 18:42</text><rect class="tl bar" x="142" y="111" width="142" height="18" rx="4" fill="#CBD5E1" style="animation-delay:0.7s"/><text x="18" y="149" font-size="13" fill="#94A3B8">Software</text><text x="282" y="149" text-anchor="end" font-size="13" font-weight="600" fill="#CBD5E1">Lightroom 13</text><rect class="tl bar" x="142" y="136" width="142" height="18" rx="4" fill="#CBD5E1" style="animation-delay:1.0499999999999998s"/><text x="18" y="174" font-size="13" fill="#94A3B8">Author</text><text x="282" y="174" text-anchor="end" font-size="13" font-weight="600" fill="#CBD5E1">Jane Doe</text><rect class="tl bar" x="142" y="161" width="142" height="18" rx="4" fill="#CBD5E1" style="animation-delay:1.4s"/><rect class="scan" x="2" y="0" width="296" height="2.5" rx="1.2" fill="#22D3EE"/><g class="sA"><rect x="100" y="196" width="100" height="28" rx="14" fill="#F87171" fill-opacity=".2" stroke="#F87171"/><text x="150" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="#F87171">Privacy 24</text></g><g class="sB"><rect x="100" y="196" width="100" height="28" rx="14" fill="#34D399" fill-opacity=".2" stroke="#34D399"/><text x="150" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="#34D399">Clean 100</text></g></g></g><rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="#26364D" stroke-width="2"/>
</svg>
