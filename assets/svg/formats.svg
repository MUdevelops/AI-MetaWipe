<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">Supported formats</title><desc id="d">Animated cards showing what JPEG, PNG, WebP and other formats support</desc>
<defs></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fl{animation:fl 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.rw{animation:rw 6s ease-in-out infinite}
@keyframes rw{0%,22%,100%{opacity:.75}8%{opacity:1}}
</style>
<rect width="1000" height="320" rx="22" fill="#0D1524"/><rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="#26364D" stroke-width="1.5"/><g class="fl" style="animation-delay:0.0s"><rect x="22" y="24" width="226" height="272" rx="18" fill="#121E30" stroke="#34D399" stroke-width="2"/><rect x="40" y="24" width="190" height="5" rx="2.5" fill="#34D399"/><text x="40" y="76" font-size="22" font-weight="800" fill="#F8FAFC">JPG / JPEG</text><text x="40" y="100" font-size="12.5" fill="#94A3B8">EXIF · GPS · IPTC · XMP</text><line x1="40" y1="116" x2="230" y2="116" stroke="#26364D"/><g class="rw" style="animation-delay:0.0s"><text x="40" y="152" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">INSPECT</text><text x="40" y="174" font-size="16" font-weight="700" fill="#34D399">✓ Full metadata</text></g><g class="rw" style="animation-delay:1.5s"><text x="40" y="204" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">REMOVE</text><text x="40" y="226" font-size="16" font-weight="700" fill="#34D399">✓ Lossless</text></g><g class="rw" style="animation-delay:3.0s"><text x="40" y="256" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">WRITE</text><text x="40" y="278" font-size="16" font-weight="700" fill="#34D399">✓ EXIF + XMP</text></g></g><g class="fl" style="animation-delay:0.5s"><rect x="264" y="24" width="226" height="272" rx="18" fill="#121E30" stroke="#22D3EE" stroke-width="2"/><rect x="282" y="24" width="190" height="5" rx="2.5" fill="#22D3EE"/><text x="282" y="76" font-size="22" font-weight="800" fill="#F8FAFC">PNG</text><text x="282" y="100" font-size="12.5" fill="#94A3B8">Text chunks · EXIF · XMP</text><line x1="282" y1="116" x2="472" y2="116" stroke="#26364D"/><g class="rw" style="animation-delay:0.4s"><text x="282" y="152" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">INSPECT</text><text x="282" y="174" font-size="16" font-weight="700" fill="#34D399">✓ Full metadata</text></g><g class="rw" style="animation-delay:1.9s"><text x="282" y="204" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">REMOVE</text><text x="282" y="226" font-size="16" font-weight="700" fill="#34D399">✓ Lossless</text></g><g class="rw" style="animation-delay:3.4s"><text x="282" y="256" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">WRITE</text><text x="282" y="278" font-size="16" font-weight="700" fill="#34D399">✓ Text + XMP</text></g></g><g class="fl" style="animation-delay:1.0s"><rect x="506" y="24" width="226" height="272" rx="18" fill="#121E30" stroke="#A78BFA" stroke-width="2"/><rect x="524" y="24" width="190" height="5" rx="2.5" fill="#A78BFA"/><text x="524" y="76" font-size="22" font-weight="800" fill="#F8FAFC">WebP</text><text x="524" y="100" font-size="12.5" fill="#94A3B8">EXIF · XMP · ICC</text><line x1="524" y1="116" x2="714" y2="116" stroke="#26364D"/><g class="rw" style="animation-delay:0.8s"><text x="524" y="152" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">INSPECT</text><text x="524" y="174" font-size="16" font-weight="700" fill="#34D399">✓ Full metadata</text></g><g class="rw" style="animation-delay:2.3s"><text x="524" y="204" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">REMOVE</text><text x="524" y="226" font-size="16" font-weight="700" fill="#34D399">✓ Lossless</text></g><g class="rw" style="animation-delay:3.8s"><text x="524" y="256" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">WRITE</text><text x="524" y="278" font-size="16" font-weight="700" fill="#FBBF24">→ PNG first</text></g></g><g class="fl" style="animation-delay:1.5s"><rect x="748" y="24" width="226" height="272" rx="18" fill="#121E30" stroke="#FBBF24" stroke-width="2"/><rect x="766" y="24" width="190" height="5" rx="2.5" fill="#FBBF24"/><text x="766" y="76" font-size="17" font-weight="800" fill="#F8FAFC">GIF · BMP · AVIF · ICO</text><text x="766" y="100" font-size="12.5" fill="#94A3B8">Browser readable</text><line x1="766" y1="116" x2="956" y2="116" stroke="#26364D"/><g class="rw" style="animation-delay:1.2000000000000002s"><text x="766" y="152" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">INSPECT</text><text x="766" y="174" font-size="16" font-weight="700" fill="#94A3B8">Size only</text></g><g class="rw" style="animation-delay:2.7s"><text x="766" y="204" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">REMOVE</text><text x="766" y="226" font-size="16" font-weight="700" fill="#FBBF24">→ Converted</text></g><g class="rw" style="animation-delay:4.2s"><text x="766" y="256" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">WRITE</text><text x="766" y="278" font-size="16" font-weight="700" fill="#FBBF24">→ PNG first</text></g></g>
</svg>
