<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">How it works</title><desc id="d">Animated four step flow: import, inspect, clean or edit, verify and download</desc>
<defs><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient><radialGradient id="pd"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.node{animation:nd 6s ease-in-out infinite}
@keyframes nd{0%,22%,100%{transform:scale(1)}8%{transform:scale(1.12)}}
.rg{opacity:0;animation:rg 6s ease-out infinite}
@keyframes rg{0%{transform:scale(.85);opacity:0}4%{opacity:.7}24%{transform:scale(1.6);opacity:0}100%{opacity:0}}
</style>
<rect width="1000" height="250" rx="22" fill="#0D1524"/><rect x="1" y="1" width="998" height="248" rx="21" fill="none" stroke="#26364D" stroke-width="1.5"/><path d="M125 78H875" stroke="#26364D" stroke-width="4" stroke-linecap="round"/><path d="M125 78H875" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.2s" repeatCount="indefinite"/></path><circle class="tb rg" cx="125" cy="78" r="38" fill="none" stroke="#22D3EE" stroke-width="2.5" style="animation-delay:0.0s"/><g class="tb node" style="animation-delay:0.0s"><circle cx="125" cy="78" r="38" fill="#121E30" stroke="#22D3EE" stroke-width="2.5"/><circle cx="125" cy="78" r="38" fill="#22D3EE" fill-opacity=".14"/></g><g transform="translate(108.0,61.0) scale(1.4166666666666667)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" style="animation-delay:0.0s" d="M12 16V4M7 9l5-5 5 5M4 20h16"/></g><circle cx="155" cy="46" r="13" fill="#22D3EE"/><text x="155" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#04121A">1</text><text x="125" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC">Import</text><text x="125" y="176" text-anchor="middle" font-size="14" fill="#94A3B8">Drop images or a folder</text><circle class="tb rg" cx="375" cy="78" r="38" fill="none" stroke="#3B82F6" stroke-width="2.5" style="animation-delay:1.5s"/><g class="tb node" style="animation-delay:1.5s"><circle cx="375" cy="78" r="38" fill="#121E30" stroke="#3B82F6" stroke-width="2.5"/><circle cx="375" cy="78" r="38" fill="#3B82F6" fill-opacity=".14"/></g><g transform="translate(358.0,61.0) scale(1.4166666666666667)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" style="animation-delay:0.4s" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></g><circle cx="405" cy="46" r="13" fill="#3B82F6"/><text x="405" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#04121A">2</text><text x="375" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC">Inspect</text><text x="375" y="176" text-anchor="middle" font-size="14" fill="#94A3B8">See hidden metadata</text><circle class="tb rg" cx="625" cy="78" r="38" fill="none" stroke="#A78BFA" stroke-width="2.5" style="animation-delay:3.0s"/><g class="tb node" style="animation-delay:3.0s"><circle cx="625" cy="78" r="38" fill="#121E30" stroke="#A78BFA" stroke-width="2.5"/><circle cx="625" cy="78" r="38" fill="#A78BFA" fill-opacity=".14"/></g><g transform="translate(608.0,61.0) scale(1.4166666666666667)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" style="animation-delay:0.8s" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></g><circle cx="655" cy="46" r="13" fill="#A78BFA"/><text x="655" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#04121A">3</text><text x="625" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC">Clean, edit, optimize</text><text x="625" y="176" text-anchor="middle" font-size="14" fill="#94A3B8">Choose exactly what changes</text><circle class="tb rg" cx="875" cy="78" r="38" fill="none" stroke="#34D399" stroke-width="2.5" style="animation-delay:4.5s"/><g class="tb node" style="animation-delay:4.5s"><circle cx="875" cy="78" r="38" fill="#121E30" stroke="#34D399" stroke-width="2.5"/><circle cx="875" cy="78" r="38" fill="#34D399" fill-opacity=".14"/></g><g transform="translate(858.0,61.0) scale(1.4166666666666667)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" style="animation-delay:1.2000000000000002s" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/></g><circle cx="905" cy="46" r="13" fill="#34D399"/><text x="905" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#04121A">4</text><text x="875" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC">Verify and download</text><text x="875" y="176" text-anchor="middle" font-size="14" fill="#94A3B8">Prove it, then save</text><circle r="7" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M125 78H875"/></circle><circle r="14" fill="url(#pd)"><animateMotion dur="6s" repeatCount="indefinite" path="M125 78H875"/></circle><text x="500.0" y="226" text-anchor="middle" font-size="13" letter-spacing="1.2" fill="#64748B">EVERYTHING HAPPENS IN YOUR BROWSER</text>
</svg>
