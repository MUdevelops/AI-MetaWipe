<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">Tech stack</title><desc id="d">Animated atom and chips: React 18, Vite 5, plain CSS, Canvas, Web Crypto, no extra dependencies</desc>
<defs></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.spin{transform-box:view-box;transform-origin:150px 125px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:fl 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<rect width="1000" height="250" rx="22" fill="#0D1524"/><rect x="1" y="1" width="998" height="248" rx="21" fill="none" stroke="#26364D" stroke-width="1.5"/><circle cx="150" cy="125" r="100" fill="#22D3EE" fill-opacity=".05"/><g class="spin" fill="none" stroke="#22D3EE" stroke-width="3"><ellipse cx="150" cy="125" rx="78" ry="30"/><ellipse cx="150" cy="125" rx="78" ry="30" transform="rotate(60 150 125)"/><ellipse cx="150" cy="125" rx="78" ry="30" transform="rotate(120 150 125)"/></g><circle class="tb pulse" cx="150" cy="125" r="11" fill="#22D3EE"/><g class="fl" style="animation-delay:0.0s"><rect x="310" y="34" width="210" height="84" rx="16" fill="#121E30" stroke="#22D3EE" stroke-width="1.8"/><circle cx="336" cy="62" r="7" fill="#22D3EE"/><text x="354" y="68" font-size="19" font-weight="800" fill="#F8FAFC">React 18</text><text x="330" y="96" font-size="13" fill="#94A3B8">UI library</text></g><g class="fl" style="animation-delay:0.45s"><rect x="536" y="34" width="210" height="84" rx="16" fill="#121E30" stroke="#A78BFA" stroke-width="1.8"/><circle cx="562" cy="62" r="7" fill="#A78BFA"/><text x="580" y="68" font-size="19" font-weight="800" fill="#F8FAFC">Vite 5</text><text x="556" y="96" font-size="13" fill="#94A3B8">Dev server and build</text></g><g class="fl" style="animation-delay:0.9s"><rect x="762" y="34" width="210" height="84" rx="16" fill="#121E30" stroke="#3B82F6" stroke-width="1.8"/><circle cx="788" cy="62" r="7" fill="#3B82F6"/><text x="806" y="68" font-size="19" font-weight="800" fill="#F8FAFC">Plain CSS</text><text x="782" y="96" font-size="13" fill="#94A3B8">Design tokens, dark and light</text></g><g class="fl" style="animation-delay:1.35s"><rect x="310" y="134" width="210" height="84" rx="16" fill="#121E30" stroke="#34D399" stroke-width="1.8"/><circle cx="336" cy="162" r="7" fill="#34D399"/><text x="354" y="168" font-size="19" font-weight="800" fill="#F8FAFC">Canvas API</text><text x="330" y="196" font-size="13" fill="#94A3B8">Crop, resize, convert</text></g><g class="fl" style="animation-delay:1.8s"><rect x="536" y="134" width="210" height="84" rx="16" fill="#121E30" stroke="#FBBF24" stroke-width="1.8"/><circle cx="562" cy="162" r="7" fill="#FBBF24"/><text x="580" y="168" font-size="19" font-weight="800" fill="#F8FAFC">Web Crypto</text><text x="556" y="196" font-size="13" fill="#94A3B8">Hashes for duplicates</text></g><g class="fl" style="animation-delay:2.25s"><rect x="762" y="134" width="210" height="84" rx="16" fill="#121E30" stroke="#FB7185" stroke-width="1.8"/><circle cx="788" cy="162" r="7" fill="#FB7185"/><text x="806" y="168" font-size="19" font-weight="800" fill="#F8FAFC">Zero extra deps</text><text x="782" y="196" font-size="13" fill="#94A3B8">Only react and react-dom</text></g>
</svg>
