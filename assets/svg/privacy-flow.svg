<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">Privacy flow</title><desc id="d">Animated diagram: processing stays on the device, only AI Agent text goes to Pollinations, pixels are never sent</desc>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.chip{animation:chp 6s ease-in-out infinite}
@keyframes chp{0%,26%,100%{fill-opacity:.12;stroke-opacity:.45}8%{fill-opacity:.4;stroke-opacity:1}}
.pk{animation:pk 3s linear infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(150px);opacity:0}}
.px{animation:px 4.5s ease-in-out infinite}
@keyframes px{0%{transform:translateX(0);opacity:1}50%{transform:translateX(110px);opacity:1}62%{transform:translateX(110px);opacity:0}100%{transform:translateX(110px);opacity:0}}
.xm{opacity:0;animation:xm 4.5s ease-in-out infinite}
@keyframes xm{0%,48%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1.25)}70%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.xm{opacity:1}}
</style>
<rect width="1000" height="380" rx="22" fill="#0D1524"/><rect x="1" y="1" width="998" height="378" rx="21" fill="none" stroke="#26364D" stroke-width="1.5"/><rect x="28" y="28" width="520" height="250" rx="18" fill="#34D399" fill-opacity=".05" stroke="#34D399" stroke-width="2"/><g transform="translate(52.0,52.0) scale(1.0)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M3 5h18v11H3zM8 20h8M12 16v4"/></g><text x="88" y="71" font-size="19" font-weight="800" fill="#F8FAFC">Your device</text><text x="212" y="71" font-size="14" fill="#94A3B8">this browser tab</text><rect class="chip" x="52" y="96" width="236" height="48" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-width="1.5" style="animation-delay:0.0s"/><g transform="translate(69.0,109.0) scale(0.9166666666666666)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M12 16V4M7 9l5-5 5 5M4 20h16"/></g><text x="104" y="125" font-size="15" font-weight="600" fill="#F8FAFC">Import images</text><rect class="chip" x="302" y="96" width="236" height="48" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-width="1.5" style="animation-delay:1.5s"/><g transform="translate(319.0,109.0) scale(0.9166666666666666)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></g><text x="354" y="125" font-size="15" font-weight="600" fill="#F8FAFC">Read metadata</text><rect class="chip" x="52" y="158" width="236" height="48" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-width="1.5" style="animation-delay:3.0s"/><g transform="translate(69.0,171.0) scale(0.9166666666666666)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></g><text x="104" y="187" font-size="15" font-weight="600" fill="#F8FAFC">Clean, edit, optimize</text><rect class="chip" x="302" y="158" width="236" height="48" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-width="1.5" style="animation-delay:4.5s"/><g transform="translate(319.0,171.0) scale(0.9166666666666666)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M12 4v12M7 11l5 5 5-5M4 20h16"/></g><text x="354" y="187" font-size="15" font-weight="600" fill="#F8FAFC">Download the result</text><text x="52" y="248" font-size="14" fill="#94A3B8">No application server. No image upload.</text><text x="52" y="268" font-size="14" fill="#94A3B8">Nothing is kept after you close the tab.</text><rect x="700" y="28" width="272" height="250" rx="18" fill="#FBBF24" fill-opacity=".05" stroke="#FBBF24" stroke-width="2" stroke-dasharray="9 7"/><g transform="translate(724.0,52.0) scale(1.0)" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"/></g><text x="762" y="71" font-size="19" font-weight="800" fill="#F8FAFC">Pollinations</text><text x="740" y="98" font-size="13" fill="#94A3B8">external service, AI Agent only</text><g transform="translate(723.0,119.0) scale(0.6666666666666666)" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M5 12l5 5 9-10"/></g><text x="750" y="132" font-size="14" font-weight="500" fill="#F8FAFC">Your typed questions</text><g transform="translate(723.0,153.0) scale(0.6666666666666666)" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M5 12l5 5 9-10"/></g><text x="750" y="166" font-size="14" font-weight="500" fill="#F8FAFC">Summary of which metadata exists</text><g transform="translate(723.0,187.0) scale(0.6666666666666666)" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="" pathLength="1" style="animation-delay:0s" d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/></g><text x="750" y="200" font-size="14" font-weight="500" fill="#F8FAFC">Field values: only if you enable it</text><g stroke="#F87171" stroke-width="2.4" stroke-linecap="round"><path d="M726 224l10 10M736 224l-10 10"/></g><text x="750" y="234" font-size="14" font-weight="800" fill="#F8FAFC">Image pixels: never sent</text><path d="M556 150H692" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 6" opacity=".7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></path><text x="624" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">AI Agent only</text><rect class="pk" x="548" y="143" width="16" height="14" rx="4" fill="#FBBF24" style="animation-delay:0s"/><rect class="pk" x="548" y="143" width="16" height="14" rx="4" fill="#FBBF24" style="animation-delay:1s"/><rect class="pk" x="548" y="143" width="16" height="14" rx="4" fill="#FBBF24" style="animation-delay:2s"/><line x1="60" y1="330" x2="640" y2="330" stroke="#26364D" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g class="px"><rect x="64" y="310" width="42" height="40" rx="8" fill="#22D3EE" fill-opacity=".18" stroke="#22D3EE" stroke-width="2"/><g transform="translate(70,316) scale(1.3)" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M8.5 8.5h.01"/></g></g><g class="tb xm"><circle cx="262" cy="330" r="17" fill="#F87171"/><path d="M255 323l14 14M269 323l-14 14" stroke="#04121A" stroke-width="3" stroke-linecap="round"/></g><line x1="262" y1="304" x2="262" y2="356" stroke="#F87171" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/><text x="300" y="336" font-size="15" font-weight="700" fill="#F8FAFC">Image pixels never leave your device</text>
</svg>
