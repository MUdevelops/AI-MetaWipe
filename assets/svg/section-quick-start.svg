th="1.5"/><g transform="translate(51.0,43.0) scale(1.4166666666666667)" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" style="animation-delay:0s" d="M13 2L4 14h7l-1 8 9-12h-7z"/></g><rect x="130" y="20" width="40" height="22" rx="11" fill="url(#ac)"/><text x="150" y="35.5" text-anchor="middle" font-size="13" font-weight="800" fill="#04121A">04</text><text x="130" y="76" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Quick start</text><text x="131" y="101" font-size="15" fill="#94A3B8">Up and running in a few commands</text>
