<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">Metadata scan illustration</title><desc id="d">Illustration of metadata fields being redacted and the privacy score rising</desc>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient></defs>
<style>
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.ring{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grow{animation:grow 3.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.sweep{animation:sweep 6s linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bar{animation:red 9s ease-in-out infinite}
@keyframes red{0%,8%{transform:scaleX(0)}22%,66%{transform:scaleX(1)}84%,100%{transform:scaleX(0)}}
.scan{animation:scan 4.5s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(56px)}50%{transform:translateY(262px)}}
.sA{animation:sA 9s ease-in-out infinite}.sB{opacity:0;animation:sB 9s ease-in-out infinite}
@keyframes sA{0%,40%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes sB{0%,40%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar{transform:scaleX(1)}.sB{opacity:1}.sA{opacity:0}}
</style>
