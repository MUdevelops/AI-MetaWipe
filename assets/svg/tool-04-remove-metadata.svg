<svg xmlns="http://www.w3.org/2000/svg" width="214" height="40" viewBox="0 0 214 40" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">04 Remove Metadata</title><desc id="d">Tool 04: Remove Metadata</desc>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#FBBF24"/></linearGradient><clipPath id="cl"><rect width="214" height="40" rx="20"/></clipPath><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>.sweep{animation-duration:4.5s}
.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
